<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F6FB" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1016" />
        <meta
            name="description"
            content="TaskFlow - plan, prioritise and finish what matters with priorities, due dates, projects and tags."
        />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="/logo192.png" />
        <link rel="manifest" href="/manifest.json" />
        <title>TaskFlow - Task Management</title>
        <script>
            // Resolves the colour scheme before first paint so there is no flash.
            // "data-mui-color-scheme" is the attribute MUI keys its CSS variables off.
            (function () {
                var mode = "light";
                try {
                    var stored = localStorage.getItem("taskflow.colorMode");
                    if (stored === "light" || stored === "dark") {
                        mode = stored;
                    } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                        mode = "dark";
                    }
                } catch (error) {
                    mode = "light";
                }
                document.documentElement.setAttribute("data-mui-color-scheme", mode);
                document.documentElement.style.colorScheme = mode;
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run TaskFlow.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
